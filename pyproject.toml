[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "ai-security-ops"
version = "1.0.0"
description = "AI-powered security operations center with LLM-driven threat detection and incident correlation"
authors = [{ name = "Alan Vo", email = "alanvo@gmail.com" }]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "pydantic>=2.5.0",
    "python-multipart>=0.0.6",
    "python-dotenv>=1.0.0",
    "httpx>=0.25.0",
    "python-jose[cryptography]>=3.3.0",
]

[project.urls]
Homepage = "https://github.com/ALANDVO/ai-security-ops-alan-vo"
Repository = "https://github.com/ALANDVO/ai-security-ops-alan-vo"
